<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Qubit Lab VR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // Céu noturno: estrelas espalhadas numa esfera ao redor do jogador.
      AFRAME.registerComponent('estrelas', {
        schema: { quantidade: { default: 600 }, raio: { default: 80 } },
        init: function () {
          const { quantidade, raio } = this.data;
          const posicoes = new Float32Array(quantidade * 3);
          for (let i = 0; i < quantidade; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 0.95); // só o hemisfério de cima
            posicoes[i * 3] = raio * Math.sin(phi) * Math.cos(theta);
            posicoes[i * 3 + 1] = raio * Math.cos(phi);
            posicoes[i * 3 + 2] = raio * Math.sin(phi) * Math.sin(theta);
          }
          const geometria = new THREE.BufferGeometry();
          geometria.setAttribute('position', new THREE.BufferAttribute(posicoes, 3));
          const material = new THREE.PointsMaterial({ color: '#ffffff', size: 0.4, sizeAttenuation: true, fog: false });
          this.el.setObject3D('mesh', new THREE.Points(geometria, material));
        }
      });

      // Chão quadriculado neon: linhas ciano brilhantes sobre a plataforma.
      AFRAME.registerComponent('grade-neon', {
        schema: { tamanho: { default: 10 }, divisoes: { default: 10 }, cor: { default: '#00ffff' } },
        init: function () {
          const { tamanho, divisoes, cor } = this.data;
          const grade = new THREE.GridHelper(tamanho, divisoes, cor, cor);
          grade.material.transparent = true;
          grade.material.opacity = 0.9;
          this.el.setObject3D('mesh', grade);
        }
      });
    </script>
  </head>
  <body>
    <a-scene renderer="antialias: true" fog="type: exponential; color: #020818; density: 0.02">
      <!-- Céu azul escuro de noite -->
      <a-sky color="#071640" material="fog: false"></a-sky>
      <a-entity estrelas></a-entity>

      <!-- Luz fraca de noite + brilho ciano vindo da plataforma -->
      <a-entity light="type: ambient; color: #3a4a80; intensity: 0.5"></a-entity>
      <a-entity light="type: point; color: #00ffff; intensity: 1.2; distance: 12" position="0 0.5 0"></a-entity>

      <!-- Plataforma -->
      <a-box position="0 -0.25 0" width="10" height="0.5" depth="10"
             material="color: #030712; roughness: 0.9"></a-box>
      <a-entity grade-neon="tamanho: 10; divisoes: 10" position="0 0.005 0"></a-entity>

      <!-- Borda neon da plataforma -->
      <a-box position="0 0.01 5" width="10.05" height="0.04" depth="0.05" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1"></a-box>
      <a-box position="0 0.01 -5" width="10.05" height="0.04" depth="0.05" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1"></a-box>
      <a-box position="5 0.01 0" width="0.05" height="0.04" depth="10.05" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1"></a-box>
      <a-box position="-5 0.01 0" width="0.05" height="0.04" depth="10.05" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1"></a-box>

      <!-- Jogador: câmera + controles do headset -->
      <a-entity id="jogador" position="0 0 3">
        <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="lineColor: #00ffff"></a-entity>
        <a-entity laser-controls="hand: left" raycaster="lineColor: #00ffff"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
