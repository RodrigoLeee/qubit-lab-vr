<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Qubit Lab VR</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="js/ambiente.js"></script>
    <script src="js/qubit.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/fenomenos.js"></script>
  </head>
  <body>
    <a-scene renderer="antialias: true"
             fog="type: exponential; color: #020818; density: 0.015"
             cursor="rayOrigin: mouse"
             raycaster="objects: .interagivel, .botao, .chao"
             mapas="inicial: menu">

      <!-- ===== Elementos comuns a todos os mapas ===== -->

      <!-- Céu azul escuro de noite -->
      <a-sky color="#071640" material="fog: false"></a-sky>
      <a-entity estrelas></a-entity>

      <!-- Luz fraca de noite + brilho ciano vindo do centro -->
      <a-entity light="type: ambient; color: #3a4a80; intensity: 0.5"></a-entity>
      <a-entity light="type: point; color: #00ffff; intensity: 1.2; distance: 12" position="0 0.5 0"></a-entity>

      <!-- Anel que marca o destino ao apontar para o chão -->
      <a-ring id="marcador-destino" rotation="-90 0 0" radius-inner="0.14" radius-outer="0.2" visible="false"
              material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1; side: double; transparent: true; opacity: 0.9"></a-ring>

      <!-- ===== Mapa: Menu ===== -->
      <a-entity mapa="nome: menu; tamanho: 10; inicioZ: 2.5">
        <a-entity plataforma-neon="tamanho: 10"></a-entity>

        <a-entity botao-neon="texto: QUBIT LAB VR; largura: 3.6; altura: 0.9; tamanhoTexto: 0.5"
                  position="0 2.75 -2.2"></a-entity>

        <a-entity class="botao" position="-1.55 1.45 -1.6" rotation="0 20 0"
                  botao-neon="texto: 1. Quântico; subtexto: Fenômenos quânticos; largura: 1.3; altura: 0.75; acao: mapa:quantico"></a-entity>
        <a-entity class="botao" position="0 1.45 -1.9"
                  botao-neon="texto: 2. Qubit; subtexto: Esfera de Bloch; largura: 1.3; altura: 0.75; acao: mapa:qubit"></a-entity>
        <a-entity class="botao" position="1.55 1.45 -1.6" rotation="0 -20 0"
                  botao-neon="texto: 3. Circuit; subtexto: Montar circuitos; largura: 1.3; altura: 0.75; acao: mapa:circuit"></a-entity>
      </a-entity>

      <!-- ===== Mapa: Quântico (plataforma grande) ===== -->
      <a-entity mapa="nome: quantico; tamanho: 40; inicioZ: 3">
        <a-entity plataforma-neon="tamanho: 40"></a-entity>
        <a-entity botao-neon="texto: QUÂNTICO; subtexto: Superposição · Medição · Emaranhamento; largura: 3.4; altura: 0.8; tamanhoTexto: 0.45"
                  position="0 4.6 -9"></a-entity>


        <!-- Estação 1: superposição (à esquerda) -->
        <a-entity position="-5 0 -3.5" rotation="0 35 0">
          <a-entity position="0 2.55 0"
                    botao-neon="texto: 1. Superposição; largura: 1.9; altura: 0.36; tamanhoTexto: 0.5"></a-entity>
          <a-entity id="placa-sup" position="0 0.62 0.5"
                    botao-neon="texto: —; subtexto: —; largura: 1.6; altura: 0.34; tamanhoTexto: 0.32"></a-entity>
          <a-entity estacao-superposicao="painel: #painel-sup; placa: #placa-sup; prefixo: sup-" position="0 1.7 0"></a-entity>
          <a-entity class="botao" position="-0.55 1.0 0.5"
                    botao-neon="texto: Mudar estado; largura: 1.0; altura: 0.36; acao: sup-mudar"></a-entity>
          <a-entity class="botao" position="0.55 1.0 0.5"
                    botao-neon="texto: Explicar; largura: 1.0; altura: 0.36; acao: sup-explicar"></a-entity>
          <a-entity id="painel-sup" painel-texto="largura: 1.7; altura: 1.15" position="0 3.35 0"></a-entity>
        </a-entity>

        <!-- Estação 2: medição (ao centro) -->
        <a-entity position="0 0 -5.5">
          <a-entity position="0 2.55 0"
                    botao-neon="texto: 2. Medição; largura: 1.9; altura: 0.36; tamanhoTexto: 0.5"></a-entity>
          <a-entity id="placa-med" position="0 0.62 0.5"
                    botao-neon="texto: —; subtexto: —; largura: 1.9; altura: 0.34; tamanhoTexto: 0.32"></a-entity>
          <a-entity estacao-medicao="painel: #painel-med; placa: #placa-med; prefixo: med-; pCima: 0.7" position="-0.45 1.7 0"></a-entity>
          <a-entity class="botao" position="-1.2 1.0 0.5"
                    botao-neon="texto: Medir; largura: 0.75; altura: 0.34; acao: med-medir"></a-entity>
          <a-entity class="botao" position="-0.4 1.0 0.5"
                    botao-neon="texto: Medir 20×; largura: 0.75; altura: 0.34; acao: med-repetir"></a-entity>
          <a-entity class="botao" position="0.4 1.0 0.5"
                    botao-neon="texto: Preparar; largura: 0.75; altura: 0.34; acao: med-preparar"></a-entity>
          <a-entity class="botao" position="1.2 1.0 0.5"
                    botao-neon="texto: Explicar; largura: 0.75; altura: 0.34; acao: med-explicar"></a-entity>
          <a-entity id="painel-med" painel-texto="largura: 1.7; altura: 1.15" position="0 3.35 0"></a-entity>
        </a-entity>

        <!-- Estação 3: emaranhamento (à direita) -->
        <a-entity position="5 0 -3.5" rotation="0 -35 0">
          <a-entity position="0 2.55 0"
                    botao-neon="texto: 3. Emaranhamento; largura: 1.9; altura: 0.36; tamanhoTexto: 0.5"></a-entity>
          <a-entity demo-emaranhamento="painel: #painel-ema; distancia: 1.6; prefixo: ema-" position="0 1.75 0"></a-entity>
          <a-entity class="botao" position="-1.05 0.95 0.5"
                    botao-neon="texto: Medir; largura: 0.95; altura: 0.36; acao: ema-medir"></a-entity>
          <a-entity class="botao" position="0 0.95 0.5"
                    botao-neon="texto: Explicar; largura: 0.95; altura: 0.36; acao: ema-explicar"></a-entity>
          <a-entity class="botao" position="1.05 0.95 0.5"
                    botao-neon="texto: Reiniciar; largura: 0.95; altura: 0.36; acao: ema-reiniciar"></a-entity>
          <a-entity id="painel-ema" painel-texto="largura: 1.7; altura: 1.15" position="0 3.35 0"></a-entity>
        </a-entity>
        <a-entity class="botao" position="-1.2 0.03 0.8" rotation="-90 0 0"
                  botao-neon="texto: MENU; largura: 1.2; altura: 0.5; tamanhoTexto: 0.5; acao: mapa:menu"></a-entity>
      </a-entity>

      <!-- ===== Mapa: Qubit (esfera de Bloch) ===== -->
      <a-entity mapa="nome: qubit; tamanho: 10; inicioZ: 2.8; obstaculo: 0.75">
        <a-entity plataforma-neon="tamanho: 10"></a-entity>

        <!-- Pilar com 3/5 da altura do jogador (1,6 m → 0,96 m) -->
        <a-cylinder position="0 0.48 0" radius="0.16" height="0.96"
                    material="color: #050b1c; roughness: 0.6"></a-cylinder>
        <a-torus position="0 0.96 0" rotation="90 0 0" radius="0.16" radius-tubular="0.008"
                 material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1"></a-torus>
        <a-torus position="0 0.02 0" rotation="90 0 0" radius="0.22" radius-tubular="0.008"
                 material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1"></a-torus>

        <!-- Qubit: diâmetro = 3/5 da altura do jogador (1,6 m → 0,96 m), apoiado no topo do pilar.
             Modelado com raio 0,27 m e ampliado 1,78× (0,27 × 1,78 ≈ 0,48 m de raio). -->
        <a-entity id="qubit" qubit="raio: 0.27; theta: 0; phi: 0" position="0 1.49 0" scale="1.78 1.78 1.78"></a-entity>

        <!-- Painel com o estado do qubit -->
        <a-entity painel-qubit="qubit: #qubit; largura: 1.3" position="1.45 1.5 0"></a-entity>

        <a-entity class="botao" position="-1.2 0.03 0.6" rotation="-90 0 0"
                  botao-neon="texto: MENU; largura: 1.2; altura: 0.5; tamanhoTexto: 0.5; acao: mapa:menu"></a-entity>
      </a-entity>

      <!-- ===== Mapa: Circuit (plataforma grande) ===== -->
      <a-entity mapa="nome: circuit; tamanho: 40; inicioZ: 3">
        <a-entity plataforma-neon="tamanho: 40"></a-entity>
        <a-entity botao-neon="texto: CIRCUIT; subtexto: Montar circuitos quânticos — em construção; largura: 3.4; altura: 1.1; tamanhoTexto: 0.4"
                  position="0 2.4 -3"></a-entity>
        <a-entity class="botao" position="-1.2 0.03 0.8" rotation="-90 0 0"
                  botao-neon="texto: MENU; largura: 1.2; altura: 0.5; tamanhoTexto: 0.5; acao: mapa:menu"></a-entity>
      </a-entity>

      <!-- ===== Jogador ===== -->
      <!-- Anda por clique no chão, WASD, laser + gatilho, analógico ou mão (apontar e pinçar) -->
      <a-entity id="jogador" position="0 0 2.5" limites-plataforma mover-jogador>
        <a-entity camera position="0 1.6 0"
                  look-controls="pointerLockEnabled: false"
                  wasd-controls="acceleration: 25"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .interagivel, .botao, .chao; lineColor: #00ffff"></a-entity>
        <a-entity laser-controls="hand: left" raycaster="objects: .interagivel, .botao, .chao; lineColor: #00ffff"
                  andar-vr="rig: #jogador"></a-entity>
        <!-- Mãos sem controles (Meta Quest):
             - pinçar perto do qubit para pegar e girar
             - apontar para um botão ou para o chão, pinçar e soltar para clicar/teleportar -->
        <a-entity hand-tracking-controls="hand: right; modelColor: #00ffff; modelOpacity: 0.7"
                  pinca-qubit="qubit: #qubit"
                  andar-mao="lado: 1"></a-entity>
        <a-entity hand-tracking-controls="hand: left; modelColor: #00ffff; modelOpacity: 0.7"
                  pinca-qubit="qubit: #qubit"
                  andar-mao="lado: -1"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
